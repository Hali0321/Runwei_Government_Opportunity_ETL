name: Azure Grants.gov Data Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:     # Manual trigger
  push:
    branches: [ main ]
    paths: 
      - 'src/**'
      - 'sql/**'

jobs:
  azure-data-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Azure SQL Tools
      run: |
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl -sSL https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
        echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> $GITHUB_ENV
    
    - name: Run Azure Data Pipeline
      env:
        AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      run: |
        echo "🚀 Starting Azure Grants.gov Data Pipeline"
        
        # Run complete pipeline
        python src/main.py <<< "4"
    
    - name: Validate Pipeline Results
      env:
        AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
      run: |
        echo "🔍 Validating pipeline results..."
        
        # Check Layer 1 records
        LAYER1_COUNT=$(sqlcmd -S grants-gov-sql-server.database.windows.net \
                               -d GrantsGovDB -U grantsadmin -P "$AZURE_SQL_PASSWORD" \
                               -Q "SELECT COUNT(*) FROM RawGrantsLayer1;" -h -1 -C)
        echo "📊 Layer 1 Records: $LAYER1_COUNT"
        
        # Check Layer 2 records  
        LAYER2_COUNT=$(sqlcmd -S grants-gov-sql-server.database.windows.net \
                               -d GrantsGovDB -U grantsadmin -P "$AZURE_SQL_PASSWORD" \
                               -Q "SELECT COUNT(*) FROM CleanGrantsLayer2;" -h -1 -C)
        echo "🧹 Layer 2 Records: $LAYER2_COUNT"
        
        # Check Layer 3 records
        LAYER3_COUNT=$(sqlcmd -S grants-gov-sql-server.database.windows.net \
                               -d GrantsGovDB -U grantsadmin -P "$AZURE_SQL_PASSWORD" \
                               -Q "SELECT COUNT(*) FROM GrantOpportunities;" -h -1 -C)
        echo "🎯 Layer 3 Records: $LAYER3_COUNT"
        
        echo "✅ Pipeline validation completed successfully"
    
    - name: Report Status
      if: always()
      run: |
        echo "📈 Azure Grants.gov Data Pipeline Status: ${{ job.status }}"
        echo "⏰ Completed at: $(date)"